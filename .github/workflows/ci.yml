name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sw_vers
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Build local-signed app
        run: bash build.sh
      - name: Core and loopback API tests
        run: bash Tests/run.sh
